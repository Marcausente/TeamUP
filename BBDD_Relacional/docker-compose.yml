version: '3.8'

services:
  mysql:
    image: mysql:latest
    container_name: TeamUpDatabase
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD:   # Cambia esto por un password seguro
      MYSQL_DATABASE: TeamUP          # Nombre de tu base de datos
      MYSQL_USER: user                     # Usuario de la base de datos
      MYSQL_PASSWORD: user_password        # Contraseña del usuario
    ports:
      - "3306:3306"                        # Mapea el puerto 3306
    volumes:
      - mysql_data:/var/lib/mysql          # Persistencia de datos

volumes:
  mysql_data:
